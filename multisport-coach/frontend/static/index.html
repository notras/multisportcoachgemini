<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiSport AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent-cyan: #00f2fe;
    --accent-blue: #4facfe;
    --accent-orange: #ff4e50;
    --bg-dark: #090d16;
    --panel-bg: rgba(15, 23, 42, 0.85);
    --card-bg: rgba(22, 33, 58, 0.9);
    --border-glow: rgba(0, 242, 254, 0.25);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark) url('/static/bg.jpg') center/cover no-repeat fixed;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  
  /* --- Header --- */
  header {
    background: rgba(9, 13, 22, 0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-glow);
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .logo-img {
    height: 42px;
    width: 42px;
    border-radius: 10px;
    box-shadow: 0 0 12px var(--border-glow);
    object-fit: cover;
  }
  .brand-title {
    font-size: 1.35rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .status-tag {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: #10b981;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }

  /* --- Main Scrollable Chat Log --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    scrollbar-width: thin;
    scrollbar-color: var(--border-glow) transparent;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 10px; }

  /* --- Message Bubbles & Animations --- */
  .msg {
    display: flex;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.25s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }
  
  .bubble {
    display: inline-block;
    padding: 0.9rem 1.25rem;
    border-radius: 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
    max-width: 88%;
    font-size: 1rem;
    line-height: 1.55;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent-blue) 0%, #1d4ed8 100%);
    color: #ffffff;
    border: none;
    box-shadow: 0 4px 18px rgba(37, 99, 235, 0.35);
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
    border-left: 3px solid var(--accent-cyan);
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
  }

  /* --- Suggestions Row --- */
  .suggestions-container {
    background: rgba(9, 13, 22, 0.7);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 0.6rem 0;
  }
  .suggestions-row {
    display: flex;
    gap: 0.65rem;
    padding: 0 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .suggestions-row::-webkit-scrollbar { display: none; }
  .suggestion-btn {
    background: rgba(22, 33, 58, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 242, 254, 0.3);
    color: #e2e8f0;
    padding: 0.55rem 1.05rem;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .suggestion-btn:hover {
    background: rgba(0, 242, 254, 0.2);
    border-color: var(--accent-cyan);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0, 242, 254, 0.4);
  }
  
  /* --- Input Bar --- */
  .input-panel {
    background: rgba(9, 13, 22, 0.9);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-glow);
    padding: 0.8rem 1.5rem 1.2rem 1.5rem;
  }
  form {
    display: flex;
    gap: 0.75rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.88rem 1.25rem;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.9);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: all 0.2s ease;
  }
  input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
  }
  button[type="submit"] {
    padding: 0.88rem 1.75rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
    color: #090d16;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 242, 254, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(0, 242, 254, 0.55);
  }

  /* --- A2UI Rich Card Styles --- */
  .a2card {
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 1.35rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.65rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.85rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.55; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.65rem; font-weight: 800; color: var(--accent-cyan); letter-spacing: 0.3px; }
  .a2text.a2-h2 { font-size: 1.35rem; font-weight: 700; color: #ffffff; }
  .a2text.a2-h3 { font-size: 1.15rem; font-weight: 600; color: var(--accent-blue); }
  .a2text.a2-caption { font-size: 0.9rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.12); margin: 0.65rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.35rem;
    vertical-align: middle;
    color: var(--accent-cyan);
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/logo.png" alt="MultiSport AI Coach" class="logo-img">
    <div class="brand-title">MultiSport AI Coach</div>
  </div>
  <div class="status-tag">
    <div class="pulse-dot"></div>
    <span>ONLINE</span>
  </div>
</header>

<div id="log"></div>

<div class="suggestions-container">
  <div class="suggestions-row">
    <button type="button" class="suggestion-btn" onclick="sendExample('Suggest a 15k trail running workout in San Francisco with weather forecast')">🏃 15K Trail Run Workout</button>
    <button type="button" class="suggestion-btn" onclick="sendExample('Check outdoor weather and road safety conditions for roller skiing in Boulder, CO')">⛷️ Roller Skiing Weather</button>
    <button type="button" class="suggestion-btn" onclick="sendExample('Use python code to calculate my heart rate training zones for age 32 with resting HR 55')">📊 HR Training Zones</button>
  </div>
</div>

<div class="input-panel">
  <form id="form">
    <input id="input" placeholder="Ask your coach (workouts, routes, weather, form tips)..." autocomplete="off" autofocus>
    <button type="submit">SEND</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendExample(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
